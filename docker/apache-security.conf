<Directory "/var/www/html">
    Options -Indexes -ExecCGI
    AllowOverride None
</Directory>

<Directory "/var/www/html/includes">
    Require all denied
</Directory>

<Directory "/var/www/html/vendor">
    Require all denied
</Directory>

<Directory "/var/www/html/docker">
    Require all denied
</Directory>

<Directory "/var/www/html/sql">
    Require all denied
</Directory>

<FilesMatch "^(koneksi\.php|composer\.(json|lock)|Dockerfile|\.dockerignore)$">
    Require all denied
</FilesMatch>
